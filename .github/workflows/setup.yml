name: setup

# Puts this family's projects in the pool and registers its health checks (setup_family.py). Runs every week (new refresh
# items) and by hand after changing family.py. The hub trusts this repo (s1d-labs/<family>) through the GitHub OIDC token; no secrets are needed.
on:
  workflow_dispatch:
  schedule:
    - cron: "30 1 * * 1"      # every Monday 01:30 UTC: seeds the week's refresh items (family.WEEK)

permissions:
  id-token: write
  contents: read

jobs:
  setup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt "scrape-hub-client @ git+https://github.com/s1d-labs/runner@sdk-stable#subdirectory=sdk"
      - run: python setup_family.py
        env:
          SCRAPE_HUB_URL: https://scrape.s1d.me
